<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>SPACE INVADERS — Classic Arcade Clone</title>
<!-- X.com player card: playable in-post embed -->

<style>
  html, body {
    margin: 0; height: 100%;
    background: #0a0a0a;
    display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", monospace;
    user-select: none;
    /* Lock zoom (games must never zoom): a zoomed page composites the
       mix-blend-mode layers against a broken backdrop -> black overlay.
       See the dblclick/gesturestart guards in the script. */
    touch-action: none;
  }
  /* Cabinet face: Asteroids bezel placeholder (same 1024x1024 panel and
     screen hole — new Space Invaders art is coming) with a
     TRANSPARENT screen window. */
  #bezel { position: relative; line-height: 0; }
  #bezel::before {
    content: "";
    display: block;
    width: 100%;
    padding-top: 100%; /* bezel.png is 1024x1024 */
  }
  /* The screen window = the transparent hole in bezel.png
     (squircle hole bbox 186,201 688x647 ≈ 1.063:1). The canvas box is
      zoomed 2% past the hole — same aspect and centre (179.12,194.53
      701.76x659.94) — so the play area reads bigger and the extra corners
      tuck under the opaque bezel. */
  #screen {
    position: absolute;
    left: 17.492%; top: 18.997%;
    width: 68.531%; height: 64.447%;
    background: #000;
  }
  canvas {
    display: block;
    background: #000;
    width: 100%; height: 100%;
    position: absolute;
    top: 0; left: 0;
  }
  /* CRT shader layer overlays the game canvas; it is smooth, not pixelated,
     and never intercepts input */
  #fx { image-rendering: auto; pointer-events: none; }
  /* Bezel art sits on top of the screen; its transparent hole shows the game */
  #panel {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  /* Screen glow: blurred game light smeared onto the plastic around the hole,
     masked by bezel.png's own alpha (Mega Bezel-style, cheap 2-pass version). */
  #glow {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background: transparent; /* must override the black canvas default */
    /* Light, not paint: screen-blend can only brighten the bezel art, never
       dim or overpaint it (previously src-over painted the smear over the
       asteroid decal art with alpha up to ~0.9). */
    mix-blend-mode: screen;
  }
  /* Additive glass reflections (baked art, black bg + screen blend),
     stretched over the full cabinet like #plexi. Art is 256x256 square:
     uniform 4x upscale, no aspect distortion. */
  #reflect {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    mix-blend-mode: screen;
    /* Two animations, two different properties (opacity + filter).
       Do NOT put the buzz on a wrapper with animated opacity: an
       ancestor opacity turns it into a grouping element and cuts
       #reflect's screen blend off from the page, so the texture's
       opaque black background ends up painted OVER the cabinet. */
    animation: neonFlicker 7.3s linear infinite,
               neonBuzz 0.08s ease-in-out infinite;
  }
  /* Continuous high-frequency buzz. Real fluorescent flicker is
     100-120Hz (invisible), so the visible stand-in is a fast ~12Hz
     trill with tiny amplitude, done as brightness so it can share the
     element with the opacity flicker. */
  @keyframes neonBuzz {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(0.96); }
  }
  /* Neon flicker: a mostly steady glow with fast, irregular micro-dips.
     Dips are short (a few frames) and snap back hard, unlike the smooth
     sine of plexiPulse. The odd 7.3s period keeps it out of sync with the
     2.6s haze pulse so the two layers never breathe together. */
  @keyframes neonFlicker {
    0%    { opacity: 1; }
    6%    { opacity: 0.94; }
    6.4%  { opacity: 1; }
    7%    { opacity: 0.86; }
    7.4%  { opacity: 1; }
    38%   { opacity: 0.96; }
    38.5% { opacity: 1; }
    55%   { opacity: 0.9; }
    55.3% { opacity: 0.99; }
    55.8% { opacity: 0.84; }
    56.4% { opacity: 1; }
    81%   { opacity: 0.93; }
    81.4% { opacity: 1; }
    100%  { opacity: 1; }
  }
  /* The old reflection pulse, now on the plexi front, scaled to its
     haze level (same 45%-to-100% relative depth as the old one). */
  @keyframes plexiPulse {
    0%, 100% { opacity: 0.10; }
    50%      { opacity: 0.22; }
  }
  /* Worn plexi front: full cabinet, same screen blend as #reflect. */
  #plexi {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: 0.22;
    animation: plexiPulse 2.6s ease-in-out infinite;
  }
  #hint {
    position: fixed; bottom: 8px; left: 0; right: 0;
    text-align: center; color: #556; font-size: 12px;
  }
</style>
</head>
<body>
<div id="bezel">
  <div id="screen">
    <canvas id="game" width="580" height="545"></canvas>
    <canvas id="fx" width="580" height="545"></canvas>
  </div>
  <img id="panel" src="bezel.webp" alt="" onerror="this.onerror=null;this.src='bezel.png'">
  <img id="reflect" src="reflect.webp" alt="" onerror="this.onerror=null;this.style.display='none'">
  <canvas id="glow" width="512" height="512"></canvas>
  <img id="plexi" alt="" onerror="this.onerror=null;this.src='plexi.png'">
</div>
<div id="hint">&larr;/&rarr; or A/D move &middot; Space fire &middot; tap to start &middot; P pause &middot; M mute &middot; C CRT: <span id="crtlabel">Glass</span></div>
<script>
"use strict";
// ============================================================
// SPACE INVADERS CLONE — single-file, vanilla JS + canvas
// Classic 1978 Taito Space Invaders (single player), pixel sprites.
// CRT effects (barrel distortion + scanlines) from LANDER/PONG.
// ============================================================

const W = 580, H = 545; // same squarish 1.064:1 window as the Asteroids bezel
const DPR = 2; // internal supersample so pixel sprites stay crisp when upscaled
const cv = document.getElementById("game");
cv.width = W * DPR; cv.height = H * DPR;
const ctx = cv.getContext("2d");
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

// Scale the cabinet to fill the viewport (pixel game + CRT shader, so
// upscaling is fine). 2% margin from the window edges.
const PANEL_W = 1024, PANEL_H = 1024; // bezel.png
const bezel = document.getElementById("bezel");
function fitCanvas() {
  const scale = Math.min(window.innerWidth / PANEL_W, window.innerHeight / PANEL_H) * 0.98;
  bezel.style.width = Math.max(240, Math.floor(PANEL_W * scale)) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

function rand(a, b) { return a + Math.random() * (b - a); }

// ---------------- Constants ----------------
const COLS = 11, ROWS = 5;
const PIX = 2.5;                     // sprite pixel scale
const COL_GAP = 38, ROW_GAP = 30;    // formation spacing
const FORM_W = (COLS - 1) * COL_GAP + 11 * PIX;
const FORM_H = (ROWS - 1) * ROW_GAP + 8 * PIX;

const PLAY_L = 30, PLAY_R = 550;     // horizontal bounds for the formation
const PLAYER_Y = 494;                // top of the cannon
const PLAYER_MIN_X = 50, PLAYER_MAX_X = 530;
const PLAYER_SPEED = 280;            // px/s

const BUNK_TOP = 428;                // top of the shields
const BUNK_W = 46, BUNK_H = 34;      // shield size on screen
const BUNK_CENTERS = [125, 235, 345, 455];
const INVADE_Y = BUNK_TOP + 4;       // formation bottom line that ends the game

const BULLET_SPEED = 480;
const MAX_PLAYER_BULLETS = 1;        // original rule: one on screen
const MAX_ENEMY_BULLETS = 3;
const ENEMY_BULLET_SPEED = 185;

const UFO_Y = 62;
const UFO_SPEED = 95;
const UFO_SCORES = [50, 100, 150, 300];

const START_LIVES = 3;
const EXTRA_LIFE_SCORE = 10000;      // original: extra cannon at 10,000
const RESPAWN_INVULN = 2.0;          // s of blinking, no collision
const HISCORE_KEY = "spaceinvaders.hiscore";

const NOTE_FREQS = [164.81, 146.83, 138.59, 130.81]; // E3 D3 C#3 C3 heartbeat

// ---------------- Sprites (classic 2-frame bitmaps) ----------------
const SPRITES = {
  squid: [ // 30 pts, top row
    ["....XXX....","....XXX....",".XXXXXXXXX.","XX.XXXXX.XX","XXXXXXXXXXX","X.XXXXXXX.X","X.X.....X.X","...XX.XX..."],
    ["....XXX....",".X..XXX..X.",".X.XXXXX.X.","XXX.XXX.XXX","XXXXXXXXXXX",".XXXXXXXXX.","..X.....X..",".XX.....XX."],
  ],
  crab: [ // 20 pts, rows 2-3
    ["..X......X..",".XX......XX.",".XXXXXXXXXX.","XXX.XXXX.XXX","XXXXXXXXXXXX","X.XXXXXXX.X.","X.X.....X.X.",".X........X."],
    ["..X......X..",".X.X....X.X.",".XXXXXXXXXX.","XXX.XXXX.XXX","XXXXXXXXXXXX",".XXXXXXXXXX.","..X......X..",".X........X."],
  ],
  octo: [ // 10 pts, rows 4-5
    ["....XXXX....",".XXXXXXXXXX.","XXXXXXXXXXXX","XXX..XX..XXX","XXXXXXXXXXXX","..XXX..XXX..",".XX..XX..XX.","XX........XX"],
    ["....XXXX....",".XXXXXXXXXX.","XXXXXXXXXXXX","XXX..XX..XXX",".XXXXXXXXXX.","..XXX..XXX..","...XX..XX...","..XX....XX.."],
  ],
  player: [
    [".....X.....","....XXX....","....XXX....",".XXXXXXXXX.","XXXXXXXXXXX","XXXXXXXXXXX","XXXXXXXXXXX","XXXXXXXXXXX"],
  ],
  ufo: [
    [".....XXXXXX.....","...XXXXXXXXXX...","..XXXXXXXXXXXX..","XXXXXXXXXXXXXXXX","XXXXXXXXXXXXXXXX","...XX..XX..XX...","....X......X...."],
  ],
};
const BUNKER_SHAPE = [ // 22x16 shield
  "....XXXXXXXXXXXXXX....",
  "...XXXXXXXXXXXXXXXX...",
  "..XXXXXXXXXXXXXXXXXX..",
  "..XXXXXXXXXXXXXXXXXX..",
  "..XXXXXXXXXXXXXXXXXX..",
  "..XXXXXXXXXXXXXXXXXX..",
  "..XXXXXXXXXXXXXXXXXX..",
  "..XXXXXXXXXXXXXXXXXX..",
  "..XXXXXXXXXXXXXXXXXX..",
  "..XXXXXXXXXXXXXXXXXX..",
  "..XXXXXXXXXXXXXXXXXX..",
  "..XXXXXXXXXXXXXXXXXX..",
  "..XXXXXXXXXXXXXXXXXX..",
  "XXXXXXX........XXXXXXX",
  "XXXXXXX........XXXXXXX",
  "XXXXXXX........XXXXXXX",
];

function makeSprite(rows, scale) {
  const w = rows[0].length, h = rows.length;
  const c = document.createElement("canvas");
  c.width = Math.ceil(w * scale * DPR); c.height = Math.ceil(h * scale * DPR);
  const g = c.getContext("2d");
  g.fillStyle = "#fff";
  const s = scale * DPR;
  for (let r = 0; r < h; r++)
    for (let cc = 0; cc < w; cc++)
      if (rows[r][cc] === "X") g.fillRect(cc * s, r * s, s + 0.5, s + 0.5);
  return { canvas: c, w: w * scale, h: h * scale };
}
const SPR = {
  squid: SPRITES.squid.map(r => makeSprite(r, PIX)),
  crab:  SPRITES.crab.map(r => makeSprite(r, PIX)),
  octo:  SPRITES.octo.map(r => makeSprite(r, PIX)),
  player: makeSprite(SPRITES.player[0], PIX),
  ufo:    makeSprite(SPRITES.ufo[0], PIX),
};

// ---------------- Game State ----------------
let state = "attract"; // attract | play | dead | wave | gameover | paused
let stateTimer = 0;
let gameoverLock = 0; // input lockout after final death — mashing fire shouldn't restart
let score = 0, hiScore = 0, lives = START_LIVES, nextExtra = EXTRA_LIFE_SCORE;
let wave = 1;
let muted = false;
let lastTime = performance.now();
let invaded = false;

try { hiScore = parseInt(localStorage.getItem(HISCORE_KEY) || "0", 10) || 0; } catch (e) {}

let player = null;      // { x, invuln }
let form = null;        // { x, y, dir, frame, stepT, note, alive, invaders[] }
let bullets = [];       // { x, y, vx, vy, t, enemy }
let bunkers = [];       // { x, y, grid: Uint8Array(22*16) }
let ufo = null;         // { x, dir, score }
let ufoTimer = 10;
let ufoSndT = 0;
let ufoBonusText = null; // { score, t } — flashing bonus in the HUD
let fireTimer = 1.0;
let popups = [];
let particles = [];
let attractUfoT = 0;

// ---------------- Input ----------------
const keys = {};
window.addEventListener("keydown", (e) => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  primeAudio();
  if (e.code === "KeyP") {
    if (state === "play") state = "paused";
    else if (state === "paused") state = "play";
  }
  if (e.code === "KeyM") muted = !muted;
  if (e.code === "KeyC") { setCRT((crtMode + 1) % 3); return; }
  if (e.code === "Space" && !e.repeat && state === "play") fireShip();
  if (state === "attract" || (state === "gameover" && gameoverLock <= 0 && !e.repeat)) startGame();
});
window.addEventListener("keyup", (e) => { keys[e.code] = false; });

// Touch: tap = start/fire, drag sideways = steer the cannon
let touchState = null;
cv.addEventListener("pointerdown", (e) => {
  primeAudio();
  if (state === "attract" || (state === "gameover" && gameoverLock <= 0)) { startGame(); return; }
  if (state === "paused") { state = "play"; return; }
  touchState = { id: e.pointerId, x: e.clientX, moved: 0, t: performance.now() };
});
cv.addEventListener("pointermove", (e) => {
  if (!touchState || e.pointerId !== touchState.id) return;
  const dx = e.clientX - touchState.x;
  touchState.x = e.clientX;
  touchState.moved += Math.abs(dx);
  if (player) player.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, player.x + dx * 2.2));
});
cv.addEventListener("pointerup", (e) => {
  if (touchState && e.pointerId === touchState.id) {
    if (touchState.moved < 10 && performance.now() - touchState.t < 300) fireShip(); // tap = fire
    touchState = null;
  }
});

// iPad fix: double-tap zoom breaks the mix-blend-mode layers (same as
// Asteroids). The cabinet fits the viewport, so no panning is lost.
document.addEventListener("dblclick", (e) => e.preventDefault());
document.addEventListener("gesturestart", (e) => e.preventDefault());

// ---------------- Game Flow ----------------
function startGame() {
  score = 0; lives = START_LIVES; nextExtra = EXTRA_LIFE_SCORE;
  wave = 1; bullets = []; popups = []; particles = [];
  ufo = null; ufoTimer = rand(8, 14); ufoBonusText = null;
  fireTimer = 1.0; invaded = false;
  player = { x: W / 2, invuln: RESPAWN_INVULN };
  spawnBunkers();
  spawnFormation();
  state = "play";
}

function nextWave() {
  wave++;
  bullets = [];
  spawnFormation();
  ufoTimer = rand(8, 14);
  state = "play";
}

function spawnFormation() {
  const types = ["squid", "crab", "crab", "octo", "octo"]; // by row: 30/20/20/10/10
  const invaders = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      invaders.push({ c, r, type: types[r], alive: true });
  form = {
    x: W / 2 - FORM_W / 2,
    y: 84 + Math.min(wave - 1, 6) * 16, // each wave starts a row lower
    dir: 1, frame: 0, stepT: 0.8, note: 0, alive: ROWS * COLS, invaders,
  };
}

function spawnBunkers() {
  bunkers = BUNK_CENTERS.map(cx => {
    const grid = new Uint8Array(22 * 16);
    for (let r = 0; r < 16; r++)
      for (let c = 0; c < 22; c++)
        grid[r * 22 + c] = BUNKER_SHAPE[r][c] === "X" ? 1 : 0;
    return { x: cx - BUNK_W / 2, y: BUNK_TOP, grid };
  });
}

function addScore(pts, x, y) {
  score += pts;
  addPopup(x, y, pts);
  if (score > hiScore) {
    hiScore = score;
    try { localStorage.setItem(HISCORE_KEY, String(hiScore)); } catch (e) {}
  }
  if (score >= nextExtra) {
    lives++; nextExtra += EXTRA_LIFE_SCORE;
    sfx.extraLife();
    addPopup(W / 2, 230, "EXTRA SHIP");
  }
}

function killInvader(v, x, y) {
  v.alive = false;
  form.alive--;
  addScore(v.type === "squid" ? 30 : v.type === "crab" ? 20 : 10, x, y);
  debris(x, y, 12, 0.45);
  sfx.invaderDie();
  if (form.alive === 0 && state === "play") {
    bullets = [];
    state = "wave"; stateTimer = 1.2;
  }
}

function killPlayer() {
  if (!player || player.invuln > 0) return;
  debris(player.x, PLAYER_Y + 10, 26, 1.0);
  sfx.shipDie();
  bullets = []; // like the original: clear the field
  player = null;
  lives--;
  if (lives <= 0) {
    state = "gameover";
    gameoverLock = 1.2; // ignore key/tap mashing for a moment
  } else {
    state = "dead"; stateTimer = 1.4;
  }
}

function invade() {
  // formation reached the ground — instant game over, like the original
  state = "gameover";
  gameoverLock = 1.2;
  invaded = true;
  sfx.shipDie();
}

// ---------------- Particles / popups ----------------
function debris(x, y, r, power) {
  const n = Math.max(8, Math.floor(r / 1.5));
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), sp = rand(40, 170) * power;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.7), s: rand(2, 4) });
  }
}
function addPopup(x, y, text) {
  popups.push({ x, y, text: String(text), life: 1.1 });
}

// ---------------- Audio (Web Audio API — same approach as LANDER/PONG) ----------------
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function primeAudio() {
  const a = audio();
  if (!a) return;
  if (a.state === "suspended") a.resume();
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    g.gain.setValueAtTime(0.0001, a.currentTime);
    o.start(); o.stop(a.currentTime + 0.06);
  } catch (e) {}
}
function beep(freq, dur, type, vol, slideTo) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
  g.gain.setValueAtTime(vol || 0.08, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(dur, vol, lowpass) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const len = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, len, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src2 = a.createBufferSource(); src2.buffer = buf;
  const f = a.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = lowpass;
  const g = a.createGain(); g.gain.value = vol;
  src2.connect(f); f.connect(g); g.connect(a.destination);
  src2.start(t);
}

const sfx = {
  fire:        () => beep(880, 0.14, "square", 0.06, 160),
  invaderDie:  () => { beep(1200, 0.07, "square", 0.05, 300); noiseBurst(0.08, 0.08, 2500); },
  invaderShot: () => beep(300, 0.08, "square", 0.028, 120),
  invaderNote: (i) => beep(NOTE_FREQS[i], 0.09, "square", 0.05),
  shipDie:     () => { noiseBurst(0.8, 0.28, 1400); beep(220, 0.7, "square", 0.09, 40); },
  bunkerHit:   () => noiseBurst(0.1, 0.09, 900),
  ufoDie:      () => { beep(660, 0.09, "square", 0.07); setTimeout(() => beep(990, 0.09, "square", 0.07), 90); setTimeout(() => beep(1320, 0.14, "square", 0.07), 180); },
  extraLife:   () => { beep(660, 0.1, "square", 0.08); setTimeout(() => beep(880, 0.1, "square", 0.08), 110); setTimeout(() => beep(1320, 0.16, "square", 0.08), 220); },
};

// ---------------- Update ----------------
function fireShip() {
  if (state !== "play" || !player) return;
  if (bullets.some(b => !b.enemy)) return; // one player bullet on screen
  bullets.push({ x: player.x, y: PLAYER_Y - 8, vx: 0, vy: -BULLET_SPEED, t: 0, enemy: false });
  sfx.fire();
}

function stepInterval() {
  const f = form ? form.alive : 55;
  const base = 0.09 + 0.43 * (f / 55) * (f / 55); // 0.52s at full -> 0.09s at the last invader
  return base / (1 + (wave - 1) * 0.05);
}

function doStep() {
  form.frame = 1 - form.frame;
  form.x += form.dir * 12;
  if (form.x + FORM_W > PLAY_R - 6 || form.x < PLAY_L + 6) {
    form.dir *= -1;
    form.x += form.dir * 12; // step back inside, then drop a row
    form.y += 14;
  }
  form.note = (form.note + 1) % 4;
  sfx.invaderNote(form.note);
  if (form.y + FORM_H >= INVADE_Y) invade();
}

function enemyFire() {
  let enemyCount = 0;
  for (const b of bullets) if (b.enemy) enemyCount++;
  if (enemyCount >= MAX_ENEMY_BULLETS) return;
  // pick a random column that still has a live invader
  const cols = [];
  for (let c = 0; c < COLS; c++)
    if (form.invaders.some(v => v.alive && v.c === c)) cols.push(c);
  if (!cols.length) return;
  const c = cols[Math.floor(Math.random() * cols.length)];
  let shooter = null;
  for (const v of form.invaders)
    if (v.alive && v.c === c && (!shooter || v.r > shooter.r)) shooter = v;
  if (!shooter) return;
  bullets.push({
    x: form.x + c * COL_GAP + (11 * PIX) / 2,
    y: form.y + shooter.r * ROW_GAP + 8 * PIX,
    vx: 0, vy: ENEMY_BULLET_SPEED + (wave - 1) * 6,
    t: rand(0, 6), enemy: true,
  });
  sfx.invaderShot();
}

function bunkerAt(x, y) {
  for (const b of bunkers)
    if (x >= b.x && x < b.x + BUNK_W && y >= b.y && y < b.y + BUNK_H) return b;
  return null;
}

function digBunker(b, x, y) {
  const cw = BUNK_W / 22, ch = BUNK_H / 16;
  const c = Math.floor((x - b.x) / cw), r = Math.floor((y - b.y) / ch);
  for (let dr = -2; dr <= 2; dr++)
    for (let dc = -2; dc <= 2; dc++) {
      if (Math.abs(dr) + Math.abs(dc) > 3) continue; // diamond crater
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < 16 && cc >= 0 && cc < 22) b.grid[rr * 22 + cc] = 0;
    }
}

function update(dt) {
  // popups + particles always animate
  for (let i = popups.length - 1; i >= 0; i--) {
    popups[i].life -= dt; popups[i].y -= 14 * dt;
    if (popups[i].life <= 0) popups.splice(i, 1);
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 1 - 1.5 * dt; p.vy *= 1 - 1.5 * dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (ufoBonusText) { ufoBonusText.t -= dt; if (ufoBonusText.t <= 0) ufoBonusText = null; }

  if (state === "attract") { attractUfoT += dt; return; }
  if (state === "gameover") { gameoverLock = Math.max(0, gameoverLock - dt); return; }
  if (state === "wave") {
    stateTimer -= dt;
    if (stateTimer <= 0) nextWave();
    return;
  }
  if (state !== "play" && state !== "dead") return;

  if (state === "dead") {
    stateTimer -= dt;
    if (stateTimer <= 0) { player = { x: W / 2, invuln: RESPAWN_INVULN }; state = "play"; }
  }

  // Player
  if (player && state === "play") {
    if (keys["ArrowLeft"] || keys["KeyA"]) player.x -= PLAYER_SPEED * dt;
    if (keys["ArrowRight"] || keys["KeyD"]) player.x += PLAYER_SPEED * dt;
    player.x = Math.max(PLAYER_MIN_X, Math.min(PLAYER_MAX_X, player.x));
    if (player.invuln > 0) player.invuln -= dt;
  }

  // Formation steps (keeps marching while the cannon respawns, like the original)
  if (form) {
    form.stepT -= dt;
    while (form.stepT <= 0 && (state === "play" || state === "dead")) {
      form.stepT += stepInterval();
      doStep();
    }
  }

  // UFO
  ufoTimer -= dt;
  if (!ufo && ufoTimer <= 0) {
    const dir = Math.random() < 0.5 ? 1 : -1;
    ufo = { x: dir > 0 ? -30 : W + 30, dir, score: UFO_SCORES[Math.floor(Math.random() * UFO_SCORES.length)] };
  }
  if (ufo) {
    ufo.x += ufo.dir * UFO_SPEED * dt;
    ufoSndT -= dt;
    if (ufoSndT <= 0 && !muted) {
      ufoSndT = 0.16;
      beep(480 + 220 * Math.sin(performance.now() / 140), 0.14, "sine", 0.03);
    }
    if (ufo.x < -40 || ufo.x > W + 40) { ufo = null; ufoTimer = rand(9, 18); }
  }

  // Invader fire
  fireTimer -= dt;
  if (fireTimer <= 0) {
    fireTimer = rand(0.8, 1.7) / (1 + (wave - 1) * 0.12);
    if (state === "play") enemyFire();
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.t += dt;
    b.x += b.vx * dt;
    if (b.enemy) b.x += Math.sin(b.t * 22) * 30 * dt; // zigzag, like the original
    b.y += b.vy * dt;
    let dead = b.y < 50 || b.y > H - 10;
    if (!dead) {
      const bk = bunkerAt(b.x, b.y);
      if (bk) { digBunker(bk, b.x, b.y); sfx.bunkerHit(); dead = true; }
    }
    if (!dead && b.enemy) {
      if (player && player.invuln <= 0 &&
          Math.abs(b.x - player.x) < 16 && b.y > PLAYER_Y - 2 && b.y < PLAYER_Y + 18) {
        killPlayer(); dead = true;
      }
    }
    if (!dead && !b.enemy) {
      if (ufo && Math.abs(b.x - ufo.x) < 20 && Math.abs(b.y - UFO_Y) < 10) {
        addScore(ufo.score, ufo.x, UFO_Y);
        ufoBonusText = { score: ufo.score, t: 2.5 };
        debris(ufo.x, UFO_Y, 16, 0.5);
        sfx.ufoDie();
        ufo = null; ufoTimer = rand(9, 18);
        dead = true;
      }
    }
    if (!dead && !b.enemy && form) {
      for (const v of form.invaders) {
        if (!v.alive) continue;
        const vx = form.x + v.c * COL_GAP, vy = form.y + v.r * ROW_GAP;
        if (b.x > vx + 2 && b.x < vx + 11 * PIX - 2 && b.y > vy + 2 && b.y < vy + 8 * PIX - 2) {
          killInvader(v, vx + (11 * PIX) / 2, vy + 4 * PIX);
          dead = true;
          break;
        }
      }
    }
    if (dead) bullets.splice(i, 1);
  }
}

// ---------------- Drawing ----------------
const INK = "rgba(235,240,250,1)";
const INK_DIM = "rgba(160,168,190,0.8)";

function drawFormation() {
  for (const v of form.invaders) {
    if (!v.alive) continue;
    const s = SPR[v.type][form.frame];
    ctx.drawImage(s.canvas, form.x + v.c * COL_GAP, form.y + v.r * ROW_GAP, s.w, s.h);
  }
}

function drawBunkers() {
  ctx.fillStyle = INK;
  for (const b of bunkers) {
    const cw = BUNK_W / 22, ch = BUNK_H / 16;
    for (let r = 0; r < 16; r++) {
      const row = r * 22;
      for (let c = 0; c < 22; c++)
        if (b.grid[row + c]) ctx.fillRect(b.x + c * cw, b.y + r * ch, cw + 0.5, ch + 0.5);
    }
  }
}

function drawPlayer() {
  // blink while invulnerable
  if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0) return;
  ctx.drawImage(SPR.player.canvas, player.x - SPR.player.w / 2, PLAYER_Y, SPR.player.w, SPR.player.h);
}

function drawUfo(x, y) {
  ctx.drawImage(SPR.ufo.canvas, x - SPR.ufo.w / 2, y - SPR.ufo.h / 2, SPR.ufo.w, SPR.ufo.h);
}

function drawBullets() {
  ctx.fillStyle = INK;
  for (const b of bullets) {
    if (!b.enemy) {
      ctx.fillRect(b.x - 1.5, b.y - 5, 3, 10);
    } else {
      const wob = Math.sin(b.t * 22);
      ctx.fillRect(b.x - 1.5 + wob * 2.5, b.y - 5, 3, 4);
      ctx.fillRect(b.x - 1.5 - wob * 2.5, b.y + 1, 3, 4);
    }
  }
}

function drawParticles() {
  ctx.fillStyle = INK_DIM;
  for (const p of particles) {
    ctx.globalAlpha = Math.min(1, p.life * 2);
    ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  ctx.font = "bold 14px 'Courier New', monospace";
  ctx.textAlign = "center";
  ctx.fillStyle = INK;
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.life);
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.textAlign = "left";
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.fillStyle = INK_DIM;
  ctx.fillText("1UP", 20, 17);
  ctx.font = "bold 19px 'Courier New', monospace";
  ctx.fillStyle = INK;
  ctx.fillText(String(score).padStart(5, "0"), 20, 38);
  ctx.textAlign = "center";
  ctx.font = "bold 13px 'Courier New', monospace";
  ctx.fillStyle = INK_DIM;
  ctx.fillText("HIGH SCORE", W / 2, 17);
  ctx.font = "bold 19px 'Courier New', monospace";
  ctx.fillStyle = INK;
  ctx.fillText(String(Math.max(hiScore, score)).padStart(5, "0"), W / 2, 38);
  // UFO bonus flashes left of the hi-score, like the original
  if (ufoBonusText && (ufoBonusText.t <= 0.5 || Math.floor(ufoBonusText.t * 6) % 2 === 0)) {
    ctx.textAlign = "right";
    ctx.fillStyle = INK;
    ctx.fillText(String(ufoBonusText.score), W / 2 - 90, 38);
  }
  // remaining cannons, bottom-left
  for (let i = 0; i < Math.max(0, lives - 1); i++) {
    ctx.globalAlpha = 0.85;
    ctx.drawImage(SPR.player.canvas, 20 + i * 26, H - 26, SPR.player.w * 0.6, SPR.player.h * 0.6);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = "right";
  ctx.font = "bold 14px 'Courier New', monospace";
  ctx.fillStyle = INK_DIM;
  ctx.fillText("WAVE " + wave, W - 18, H - 12);
}

function centerText(text, y, font, color, tracking) {
  tracking = tracking || 0;
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = "center";
  if (tracking > 0) {
    const widths = [...text].map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + tracking * (text.length - 1);
    let x = W / 2 - total / 2;
    ctx.textAlign = "left";
    [...text].forEach((c, i) => { ctx.fillText(c, x, y); x += widths[i] + tracking; });
  } else {
    ctx.fillText(text, W / 2, y);
  }
}

function drawAttract() {
  centerText("HIGH SCORE", 26, "bold 14px 'Courier New', monospace", INK_DIM);
  centerText(String(hiScore).padStart(5, "0"), 48, "bold 20px 'Courier New', monospace", INK);

  centerText("SPACE INVADERS", 96, "bold 40px 'Courier New', monospace", INK, 6);
  centerText("A  C L A S S I C   A R C A D E   C L O N E", 122, "13px 'Courier New', monospace", INK_DIM);

  // score chart, like the original attract screen
  const chart = [
    { s: SPR.squid[0], pts: "= 30 PTS" },
    { s: SPR.crab[0],  pts: "= 20 PTS" },
    { s: SPR.octo[0],  pts: "= 10 PTS" },
    { s: SPR.ufo,      pts: "= ??? PTS" },
    { s: SPR.player,   pts: "= 1UP" },
  ];
  let y = 180;
  for (const row of chart) {
    ctx.drawImage(row.s.canvas, 210, y - 16, row.s.w, row.s.h);
    ctx.textAlign = "left";
    ctx.font = "bold 17px 'Courier New', monospace";
    ctx.fillStyle = INK;
    ctx.fillText(row.pts, 268, y - 2);
    y += 46;
  }
  // saucer drifts across above the chart, like the cabinet marquee
  const ax = ((attractUfoT * 55) % (W + 140)) - 70;
  ctx.globalAlpha = 0.9;
  drawUfo(ax, 146);
  ctx.globalAlpha = 1;

  if (Math.floor(performance.now() / 600) % 2 === 0)
    centerText("PRESS ANY KEY OR TAP TO START", 462, "16px 'Courier New', monospace", INK);
  centerText("ARROWS OR A/D MOVE \u00b7 SPACE FIRE", 500, "12px 'Courier New', monospace", INK_DIM);
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  if (state === "attract") { drawAttract(); return; }

  drawBunkers();
  if (form) drawFormation();
  if (ufo) drawUfo(ufo.x, UFO_Y);
  drawBullets();
  drawParticles();
  if (player) drawPlayer();
  drawPopups();
  drawHUD();

  if (state === "gameover") {
    ctx.fillStyle = "rgba(0,0,0,0.55)";
    ctx.fillRect(0, 0, W, H);
    centerText("GAME OVER", H / 2 - 26, "bold 38px 'Courier New', monospace", INK, 8);
    centerText(invaded ? "THE INVADERS LANDED" : "SCORE " + String(score).padStart(5, "0"), H / 2 + 8, "16px 'Courier New', monospace", INK_DIM);
    if (gameoverLock <= 0 && Math.floor(performance.now() / 600) % 2 === 0)
      centerText("PRESS ANY KEY TO PLAY AGAIN", H / 2 + 46, "15px 'Courier New', monospace", INK);
  } else if (state === "paused") {
    centerText("PAUSED", H / 2, "bold 30px 'Courier New', monospace", INK, 8);
  }
}

// ---------------- Main loop ----------------
function frame(t) {
  const dt = Math.min(0.033, (t - lastTime) / 1000);
  lastTime = t;
  if (state !== "paused") update(dt);
  draw();
  fxRender(t / 1000);
  glowRender();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------------- CRT glass (WebGL shader layer — from LANDER/PONG) ----------------
// Game renders to 2D canvas, uploaded as a texture and drawn through a
// fragment shader (scanlines, barrel distortion / tube curvature, glass sheen).
let fx = document.getElementById("fx");
fx.width = W * DPR; fx.height = H * DPR; // 1:1 with the game canvas
const crtlabel = document.getElementById("crtlabel");
let fxGL = null;

function initFX() {
  const gl = fx.getContext("webgl", { alpha: false });
  if (!gl) return;
  const VS = [
    "attribute vec2 a_pos;",
    "varying vec2 vUv;",
    "void main() {",
    "  vUv = vec2(0.5 + a_pos.x * 0.5, 0.5 - a_pos.y * 0.5);",
    "  gl_Position = vec4(a_pos, 0.0, 1.0);",
    "}",
  ].join("\n");
  const FS = [
    "precision highp float;",
    "varying vec2 vUv;",
    "uniform sampler2D u_tex;",
    "uniform vec2 u_res;",
    "uniform float u_time;",
    "uniform int u_mode; // 0 pass-through, 1 arcade CRT, 2 glass TV",
    "uniform float u_refl; // 1 = procedural glass reflections on, 0 = off (show baked art)",
    "uniform float u_comb; // RGB channel separation strength (0 = clean, 1 = full)", 
    "uniform sampler2D u_plexi; // plexiglass wear texture (grayscale, 0.5 = clean)",
    "uniform float u_plexiAmt; // plexiglass wear strength (0 = off)",
    "vec3 glow8(sampler2D t, vec2 p, vec2 px) {",
    "  vec3 s = vec3(0.0);",
    "  s += texture2D(t, p + vec2( px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(-px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(0.0,  px.y)).rgb;",
    "  s += texture2D(t, p + vec2(0.0, -px.y)).rgb;",
    "  s += texture2D(t, p + vec2(2.0*px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(-2.0*px.x, 0.0)).rgb;",
    "  s += texture2D(t, p + vec2(0.0, 2.0*px.y)).rgb;",
    "  s += texture2D(t, p + vec2(0.0, -2.0*px.y)).rgb;",
    "  return s * 0.125;",
    "}",
    "void main() {",
    "  vec2 uv = vUv;",
    "  vec2 px = 1.0 / u_res;",
    "  vec2 c = uv - 0.5;",
    "  float r2 = dot(c, c);",
    "  vec3 col;",
    "  if (u_mode == 2) { // glass TV — barrel distortion + scanlines + vignette",
    "    vec2 suv = 0.5 + c * (1.0 + 0.18 * r2);",
    "    if (suv.x < 0.0 || suv.x > 1.0 || suv.y < 0.0 || suv.y > 1.0) {",
    "      gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return;",
    "    }",
    "    // RGB channel separation (comb fringe), scaled by u_comb",
    "    col = vec3(",
    "      texture2D(u_tex, suv + vec2(0.5, 0.4) * px * u_comb).r + 0.02 * u_comb,",
    "      texture2D(u_tex, suv + vec2(0.0, -0.6) * px * u_comb).g + 0.02 * u_comb,",
    "      texture2D(u_tex, suv + vec2(-0.9, 0.0) * px * u_comb).b + 0.02 * u_comb);",

    "    col += (glow8(u_tex, suv, px) - col) * 0.30;",
    "    col = clamp(col * 1.3 + 0.75 * col * col + 1.25 * col * col * col * col * col, vec3(0.0), vec3(10.0));",
    "    float vig = 0.01 + 16.0 * uv.x * uv.y * (1.0 - uv.x) * (1.0 - uv.y);",
    "    col *= 1.3 * sqrt(vig);",
    "    float scans = clamp(0.35 + 0.18 * sin(u_time * 6.0 - suv.y * u_res.y * 1.5), 0.0, 1.0);",
    "    col *= pow(scans, 0.9);",
    "    col *= 1.0 - 0.23 * clamp(mod(suv.x * u_res.x, 3.0) / 2.0, 0.0, 1.0);",
    "    vec3 fc = max(col, vec3(0.0));",
    "    col = (fc * (6.2 * fc + 0.5)) / (fc * (6.2 * fc + 1.7) + 0.06);",
    "    float d = uv.x * 0.65 + uv.y * 0.75;",
    "    float sheen = exp(-pow((d - 1.08) / 0.16, 2.0)) * 0.05;",
    "    sheen += exp(-pow(length(uv - vec2(0.16, 0.14)) / 0.30, 2.0)) * 0.035;",
    "    col += sheen * u_refl;",

    "    // --- glass reflections (procedural, ShaderGlass-style) ---",
    "    float fres = clamp(0.10 + 1.8 * r2, 0.0, 1.0);",
    "    float bandPos = uv.x * 0.7 + uv.y * 0.55 - 0.25 - 0.05 * sin(u_time * 0.15);",
    "    float refBand = exp(-pow(bandPos / 0.20, 2.0));",
    "    float refEdge = exp(-pow((bandPos + 0.26) / 0.045, 2.0));",
    "    float refLight = exp(-pow(length(uv - vec2(0.16, 0.18)) / 0.34, 2.0));",
    "    vec3 refl = refBand * vec3(0.10, 0.115, 0.13);",
    "    refl += refEdge * vec3(0.055, 0.065, 0.075);",
    "    refl += refLight * vec3(0.09, 0.085, 0.075);",
    "    col += refl * (0.45 + 0.55 * fres) * u_refl;",

    "    col *= 1.0 + 0.008 * sin(u_time * 377.0);",
    "  } else if (u_mode == 1) { // arcade CRT: scanlines + grille + glow",
    "    col = texture2D(u_tex, uv).rgb;",
    "    float row = fract(uv.y * u_res.y * 0.5);",
    "    col *= 0.80 + 0.20 * cos(row * 6.28318);",
    "    col *= 0.95 + 0.05 * cos(fract(uv.x * u_res.x) * 3.14159);",
    "    col += (glow8(u_tex, uv, px) - col) * 0.40;",
    "    col = vec3(pow(max(col.r, 0.0), 0.625), pow(max(col.g, 0.0), 0.625), pow(max(col.b, 0.0), 0.625));",
    "    col *= 1.0 - 0.30 * smoothstep(0.18, 0.50, r2);",
    "  } else {",
    "    col = texture2D(u_tex, uv).rgb;",
    "  }",
    "  // Plexiglass wear (curved stress cracks in the material, straight hairline",
    "  // scratches on the surface, dust). Fixed in glass coordinates (vUv, not",
    "  // barrel-distorted). Lit from below by the local scene light: bright",
    "  // pixels glow along the scratches.",
    "  float wear = texture2D(u_plexi, vUv).g - 0.5;",
    "  float pluma = max(max(col.r, col.g), col.b);",
    "  col += wear * u_plexiAmt * pluma;",
    "  gl_FragColor = vec4(col, 1.0);",

    "}",
  ].join("\n");

  function makeShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error(gl.getShaderInfoLog(s)); return null;
    }
    return s;
  }
  const vs = makeShader(gl.VERTEX_SHADER, VS);
  const fs = makeShader(gl.FRAGMENT_SHADER, FS);
  if (!vs || !fs) return;
  const p = gl.createProgram();
  gl.attachShader(p, vs); gl.attachShader(p, fs); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(p)); return;
  }
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const plexiTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, plexiTex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  fxGL = {
    gl, p, tex, plexiTex,
    aPos: gl.getAttribLocation(p, "a_pos"),
    uTex: gl.getUniformLocation(p, "u_tex"),
    uPlexi: gl.getUniformLocation(p, "u_plexi"),
    uPlexiAmt: gl.getUniformLocation(p, "u_plexiAmt"),
    uRes: gl.getUniformLocation(p, "u_res"),
    uTime: gl.getUniformLocation(p, "u_time"),
    uMode: gl.getUniformLocation(p, "u_mode"),
    uRefl: gl.getUniformLocation(p, "u_refl"),
    uComb: gl.getUniformLocation(p, "u_comb"),
  };
}

function setupFxEvents() {
  fx.addEventListener("webglcontextlost", (e) => {
    e.preventDefault();
    fxGL = null;
    setCRT(0);
  });
  fx.addEventListener("webglcontextrestored", () => {
    initFX();
    plexiReady = false;
    loadPlexi();
    setCRT(2);
  });
}

initFX();
setupFxEvents();

// Plexiglass wear texture (grayscale, 0.5 = clean), embedded as a data URL so
// the WebGL upload works from file:// (a plain file:// image is cross-origin-
// tainted and texImage2D throws a SecurityError). 2026-11-05: re-embedded from
// the approved Krea plexi.webp (screen-box crop 179,194,881,855 → 1024×963,
// L' = 128 + v*0.75*127/255, WEBP q85) — replaced the procedural v6 embed

// TEMP (texture testing): DOM layer pulls the disk file so edits show on
// reload without re-embedding. Revert to PLEXI_TEX when done, then run the
// re-embed recipe on the final texture.
document.getElementById("plexi").src = "plexi.webp";
let plexiReady = false;
let plexiImg = null;
// The cached image lets fx context-restore re-uploads skip the reload.
function plexiUpload(gl, tex) {
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, plexiImg);
}
function loadPlexi() {
  const push = () => {
    if (fxGL && !fxGL.gl.isContextLost()) { plexiUpload(fxGL.gl, fxGL.plexiTex); plexiReady = true; }
  };
  if (plexiImg) { push(); return; }
  const im = new Image();
  im.onload = () => { plexiImg = im; push(); };
  im.src = PLEXI_TEX;
}
loadPlexi();

let crtMode = 2; // 0 off, 1 arcade, 2 glass
const COMB = 0.5; // RGB channel separation strength (locked; procedural glass refl removed — baked art)
const CRT_NAMES = ["Off", "Arcade", "Glass"];
function setCRT(m) {
  crtMode = fxGL ? m : 0;
  fx.style.display = fxGL ? "block" : "none"; // plexi glass lives in this pass, so it stays on in every mode
  if (crtlabel) crtlabel.textContent = fxGL ? CRT_NAMES[crtMode] : "No WebGL";
}
function fxRender(t) {
  const f = fxGL;
  if (!f || f.gl.isContextLost()) return; // plexi pass runs in every CRT mode
  const { gl, p, tex } = f;
  gl.viewport(0, 0, fx.width, fx.height);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, f.plexiTex);
  gl.useProgram(p);
  gl.enableVertexAttribArray(f.aPos);
  gl.vertexAttribPointer(f.aPos, 2, gl.FLOAT, false, 0, 0);
  gl.uniform1i(f.uTex, 0);
  gl.uniform1i(f.uPlexi, 1);
  gl.uniform2f(f.uRes, W, H);
  gl.uniform1f(f.uTime, t);
  gl.uniform1i(f.uMode, crtMode);
  gl.uniform1f(f.uRefl, 0.0);
  gl.uniform1f(f.uComb, COMB);
  gl.uniform1f(f.uPlexiAmt, plexiReady ? PLEXI_AMT : 0.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
}
setCRT(2);

// ---------------- Bezel glow (Mega Bezel-style, cheap version) ----------------
// Blurs the game screen and smears it onto the plastic around the hole.
// The bezel's own alpha is baked at startup into a mask + distance texture,
// so the glow follows the squircle contour 1:1, is sharpest at the glass and
// gets fuzzier with distance (same trick as Mega Bezel's reflection pass).
// Cost per frame: 1 canvas upload + 4 tiny 256x256 blur passes + 1 512x512 composite.
const GLOW = {
  intensity: 0.8,   // master brightness (balance vs the baked-in reflections)
  maxDist: 96,      // glow reach in panel px from the hole edge
  on: true,
};
const glowCv = document.getElementById("glow");
let glowGL = null;

function initGlow() {
  const gl = glowCv.getContext("webgl", {
    alpha: true, premultipliedAlpha: true, antialias: false,
    depth: false, stencil: false,
  });
  if (!gl) { glowCv.style.display = "none"; return; }

  const VS = [
    "attribute vec2 a_pos;",
    "varying vec2 vUv;",
    "void main() {",
    "  vUv = vec2(0.5 + a_pos.x * 0.5, 0.5 - a_pos.y * 0.5);",
    "  gl_Position = vec4(a_pos, 0.0, 1.0);",
    "}",
  ].join("\n");
  const BLUR_FS = [
    "precision highp float;",
    "varying vec2 vUv;",
    "uniform sampler2D u_tex;",
    "uniform vec2 u_px;",
    "uniform float u_axis;   // 0 = horizontal, 1 = vertical",
    "uniform float u_scale;  // kernel radius multiplier",
    "void main() {",
    "  vec2 o = (u_axis < 0.5) ? vec2(u_px.x, 0.0) * u_scale : vec2(0.0, u_px.y) * u_scale;",
    "  vec3 s = vec3(0.0);",
    "  s += texture2D(u_tex, vUv).rgb * 0.227027;",
    "  s += texture2D(u_tex, vUv + o).rgb * 0.1945946;",
    "  s += texture2D(u_tex, vUv - o).rgb * 0.1945946;",
    "  s += texture2D(u_tex, vUv + o * 2.0).rgb * 0.1216216;",
    "  s += texture2D(u_tex, vUv - o * 2.0).rgb * 0.1216216;",
    "  s += texture2D(u_tex, vUv + o * 3.0).rgb * 0.054054;",
    "  s += texture2D(u_tex, vUv - o * 3.0).rgb * 0.054054;",
    "  s += texture2D(u_tex, vUv + o * 4.0).rgb * 0.016216;",
    "  s += texture2D(u_tex, vUv - o * 4.0).rgb * 0.016216;",
    "  gl_FragColor = vec4(s, 1.0);",
    "}",
  ].join("\n");
  const COMP_FS = [
    "precision highp float;",
    "varying vec2 vUv; // panel space, (0,0) = top-left",
    "uniform sampler2D u_blur1;",
    "uniform sampler2D u_blur2;",
    "uniform sampler2D u_mask; // r = plastic mask, g = dist to hole / maxDist",
    "uniform float u_intensity;",
    "void main() {",
    "  vec4 m = texture2D(u_mask, vUv);",
    "  float plastic = m.r;",
    "  if (plastic < 0.004) { gl_FragColor = vec4(0.0); return; }",
    "  float dist = m.g; // 0 at the hole edge, 1 at GLOW.maxDist or beyond",
    "  // Game-screen UVs, extended past [0,1] so edge colour bleeds onto the",
    "  // plastic when objects fly off screen (CLAMP_TO_EDGE does the smearing).",
    "  vec2 guv = (vUv * 1024.0 - vec2(179.12, 194.53)) / vec2(701.76, 659.94);",
    "  // Sharper near the glass, fuzzier further out",
    "  vec3 col = mix(texture2D(u_blur1, guv).rgb, texture2D(u_blur2, guv).rgb,",
    "                 smoothstep(0.15, 0.75, dist));",
    "  // Radial fade with distance from the glass",
    "  float radial = pow(clamp(1.0 - dist, 0.0, 1.0), 1.7);",
    "  // Lateral fade toward the ends of the strips",
    "  float inX = step(0.0, guv.x) * step(guv.x, 1.0);",
    "  float inY = step(0.0, guv.y) * step(guv.y, 1.0);",
    "  float latTB = 1.0 - smoothstep(0.42, 0.50, abs(guv.x - 0.5));",
    "  float latLR = 1.0 - smoothstep(0.42, 0.50, abs(guv.y - 0.5));",
    "  float lat = inX * (1.0 - inY) * latTB",
    "            + inY * (1.0 - inX) * latLR",
    "            + ((1.0 - inX) * (1.0 - inY) + inX * inY) * latTB * latLR;",
    "  // Hot rim right at the glass edge",
    "  float rim = exp(-dist * 14.0);",
    "  col *= u_intensity * radial * lat * (0.8 + 0.6 * rim);",
    "  float a = clamp(radial * lat * plastic, 0.0, 1.0) * 0.7; // cap: light, not paint",
    "  gl_FragColor = vec4(col * a, a); // premultiplied",
    "}",
  ].join("\n");

  function makeShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      console.error("glow shader:", gl.getShaderInfoLog(s)); return null;
    }
    return s;
  }
  function makeProgram(fs) {
    const p = gl.createProgram();
    gl.attachShader(p, vs); gl.attachShader(p, fs);
    gl.bindAttribLocation(p, 0, "a_pos");
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
      console.error("glow link:", gl.getProgramInfoLog(p)); return null;
    }
    return p;
  }
  const vs = makeShader(gl.VERTEX_SHADER, VS);
  const bf = makeShader(gl.FRAGMENT_SHADER, BLUR_FS);
  const cf = makeShader(gl.FRAGMENT_SHADER, COMP_FS);
  if (!vs || !bf || !cf) { glowCv.style.display = "none"; return; }
  const blurP = makeProgram(bf);
  const compP = makeProgram(cf);
  if (!blurP || !compP) { glowCv.style.display = "none"; return; }

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  function makeTex() {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }
  const srcTex = makeTex();
  const maskTex = makeTex();

  const BS = 256;
  function makeFBO() {
    const tex = makeTex();
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, BS, BS, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { fbo, tex };
  }
  const fboA = makeFBO(), fboB = makeFBO(), fboC = makeFBO();

  glowGL = {
    gl, blurP, compP, srcTex, maskTex, fboA, fboB, fboC,
    aPos: gl.getAttribLocation(blurP, "a_pos"),
    bTex: gl.getUniformLocation(blurP, "u_tex"),
    bPx: gl.getUniformLocation(blurP, "u_px"),
    bAxis: gl.getUniformLocation(blurP, "u_axis"),
    bScale: gl.getUniformLocation(blurP, "u_scale"),
    cB1: gl.getUniformLocation(compP, "u_blur1"),
    cB2: gl.getUniformLocation(compP, "u_blur2"),
    cMask: gl.getUniformLocation(compP, "u_mask"),
    cInt: gl.getUniformLocation(compP, "u_intensity"),
  };
}

const panelImg = document.getElementById("panel");
let maskBaked = false;
function bakeGlowMask() {
  if (maskBaked || !glowGL) return;
  if (!panelImg.complete || !panelImg.naturalWidth) return;
  // Always use the pre-baked mask (GLOW_FALLBACK_MASK). It is traced to
  // follow the decal art's asteroid lobe outlines on the left intrusion,
  // whereas baking from the bezel's live alpha follows the smooth alpha
  // gradient (5-10px different) and can pick up stray semi-transparent
  // pixels — so the two masks disagreed between browsers. One source of
  // truth everywhere; re-bake it if the bezel art changes.
  bakeGlowMaskFallback();
}
function bakeGlowMaskFallback() {
  const S = glowCv.width;
  const mc = document.createElement("canvas");
  mc.width = mc.height = S;
  const mctx = mc.getContext("2d");
  const fb = new Image();
  fb.onload = () => {
    mctx.drawImage(fb, 0, 0, S, S);
    uploadGlowMaskPacked(mctx.getImageData(0, 0, S, S).data); // data URIs never taint
  };
  fb.src = "data:image/png;base64," + GLOW_FALLBACK_MASK;
}
function uploadGlowMaskPacked(px) {
  const S = glowCv.width;
  const gl = glowGL.gl;
  gl.bindTexture(gl.TEXTURE_2D, glowGL.maskTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, S, S, 0, gl.RGBA, gl.UNSIGNED_BYTE, px);
  maskBaked = true;
}

  const maxD = GLOW.maxDist / 2; // texels
  for (let i = 0; i < S * S; i++) {
    out[i * 4] = mask[i];
    out[i * 4 + 1] = d[i] >= maxD ? 255 : Math.min(255, Math.round(d[i] / maxD * 255));
    out[i * 4 + 3] = 255;
  }
  const gl = glowGL.gl;
  gl.bindTexture(gl.TEXTURE_2D, glowGL.maskTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, S, S, 0, gl.RGBA, gl.UNSIGNED_BYTE, out);
  maskBaked = true;
}

function bakeMaskWhenReady() {
  bakeGlowMask();
  if (!maskBaked) panelImg.addEventListener("load", bakeGlowMask, { once: true });
}

function glowRender() {
  const g = glowGL;
  if (!g || !GLOW.on || !maskBaked || g.gl.isContextLost()) return;
  const gl = g.gl;
  const BS = 256;
  gl.bindTexture(gl.TEXTURE_2D, g.srcTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.useProgram(g.blurP);
  gl.enableVertexAttribArray(g.aPos);
  gl.vertexAttribPointer(g.aPos, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(g.bPx, 1 / BS, 1 / BS);
  gl.uniform1i(g.bTex, 0);
  const pass = (src, dst, axis, scale) => {
    gl.bindFramebuffer(gl.FRAMEBUFFER, dst);
    gl.viewport(0, 0, BS, BS);
    gl.bindTexture(gl.TEXTURE_2D, src);
    gl.uniform1f(g.bAxis, axis);
    gl.uniform1f(g.bScale, scale);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
  pass(g.srcTex, g.fboA.fbo, 0, 1.0); // H
  pass(g.fboA.tex, g.fboB.fbo, 1, 1.0); // V  -> fboB = blur level 1
  pass(g.fboB.tex, g.fboC.fbo, 0, 2.0); // H
  pass(g.fboC.tex, g.fboA.fbo, 1, 2.0); // V  -> fboA = blur level 2
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, glowCv.width, glowCv.height);
  gl.useProgram(g.compP);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, g.fboB.tex);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, g.fboA.tex);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, g.maskTex);
  gl.uniform1i(g.cB1, 0);
  gl.uniform1i(g.cB2, 1);
  gl.uniform1i(g.cMask, 2);
  gl.uniform1f(g.cInt, GLOW.intensity);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
}

initGlow();
bakeMaskWhenReady();
glowCv.addEventListener("webglcontextlost", (e) => { e.preventDefault(); glowGL = null; });
glowCv.addEventListener("webglcontextrestored", () => {
  maskBaked = false;
  initGlow();
  bakeMaskWhenReady();
});
</script>
